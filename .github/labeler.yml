# Labels based on files changed
frontend:
  - 'src/**/*'
  - '*.vue'

styling:
  - 'src/**/*.css'
  - 'src/**/*.scss'
  - 'src/**/*.sass'
  - 'tailwind.config.*'

components:
  - 'src/components/**/*'

views:
  - 'src/views/**/*'

router:
  - 'src/router/**/*'

stores:
  - 'src/stores/**/*'

composables:
  - 'src/composables/**/*'

types:
  - 'src/types/**/*'

services:
  - 'src/services/**/*'

tests:
  - '**/*.test.*'
  - '**/*.spec.*'
  - 'tests/**/*'
  - 'e2e/**/*'

documentation:
  - '*.md'
  - 'docs/**/*'

config:
  - '*.config.*'
  - '.eslintrc.*'
  - '.prettierrc.*'
  - 'tsconfig.*'
  - 'package.json'
  - 'package-lock.json'

ci/cd:
  - '.github/**/*'
  - '.husky/**/*'

dependencies:
  - 'package.json'
  - 'package-lock.json'
